name: Renovate

on:
  schedule:
    # 每天 02:17 / 14:17 Asia/Shanghai(UTC+8) → 18:17 / 06:17 UTC。
    # 跑两次是因为目标仓库都关着 GitHub 原生 auto-merge（allow_auto_merge=false），
    # Renovate 只能在"下一轮"回来自己合已变绿的 PR。一天两轮把合并延迟压到 ~12h。
    - cron: "17 18 * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run（只打印计划，不开 PR / 不合并）"
        type: boolean
        default: false
      logLevel:
        description: "日志级别"
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@0984fb80fc633b17e57f3e8b6c007fe0dc3e0d62 # v40.3.6
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
