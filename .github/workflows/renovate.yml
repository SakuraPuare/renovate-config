name: Renovate

on:
  schedule:
    # 每天 02:17 + 03:17 Asia/Shanghai(UTC+8) → 18:17 + 19:17 UTC。
    #
    # ⚠️ 两个时间【必须都落在 default.json 的 schedule 窗口 (after 2am and before 7am) 内】。
    # 2026-08-02 实测教训：初版第二轮设在 14:17 CST，在窗口外 → 该轮对普通更新完全无事可做
    # （dry-run 日志里 Hive 115 个依赖只产出 4 个 vulnerability 分支，普通更新全被 schedule 挡掉，
    # 因为只有 vulnerabilityAlerts 显式设了 schedule:null 才能穿过窗口）。
    #
    # 为什么要跑两轮：目标仓库都关着 GitHub 原生 auto-merge（allow_auto_merge=false），
    # 故 platformAutomerge:false，由 Renovate 自己调 API 合。有 CI 的仓库 PR 刚开时检查还没绿，
    # 第一轮合不了，需要下一轮回来合 → 间隔 1h 足够（CI 几分钟就跑完），不需要隔 12h。
    - cron: "17 18 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run（只打印计划，不开 PR / 不合并）"
        type: boolean
        default: false
      logLevel:
        description: "日志级别"
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@0984fb80fc633b17e57f3e8b6c007fe0dc3e0d62 # v40.3.6
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
