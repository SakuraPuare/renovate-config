name: Renovate

on:
  # ⚠️ 定时触发已于 2026-08-03 停用 —— 真正的 runner 已挪进家里 K8s 集群
  # （homelab-gitops 仓库 apps/renovate，CronJob "17 2,3 * * *" + timeZone Asia/Shanghai）。
  #
  # 停用原因：① 本账号免费 Actions 配额耗尽（3000/3000），runner 不再分配，
  # 报 `Requested labels are not supported: ubuntu-latest`；② 即使配额恢复，
  # 两边同时定时跑会并发操作同一批仓库 —— 实测两个 Renovate 实例用同一 token
  # 并发时会 `FATAL: Initialization error / Authentication failure`。
  #
  # 本 workflow 保留 workflow_dispatch 作应急手动入口（集群挂了时的兜底）。
  # 若要恢复定时，必须先停掉集群那边的 CronJob，且新 cron 时间要落在
  # default.json 的 schedule 窗口（after 2am and before 7am, Asia/Shanghai）内 ——
  # 窗口外的 run 对普通更新完全无事可做，只有 vulnerabilityAlerts（显式
  # schedule:null）能穿过。2026-08-02 实测踩过：窗口外那轮在 Hive 上看到
  # 115 个依赖，却只产出 4 个 vulnerability 分支。
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run（只打印计划，不开 PR / 不合并）"
        type: boolean
        default: false
      logLevel:
        description: "日志级别"
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          configurationFile: config.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
